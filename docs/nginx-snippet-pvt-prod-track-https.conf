# pvt-prod-track over the shared HTTPS entry on zeus.
#
# Install to /etc/nginx/snippets/pvt-prod-track-https.conf and `include` it in
# place of the `location / { return 404; }` line of
# /etc/nginx/conf.d/nav-api-ip.conf.
#
# Why it lives inside the nav-api vhost instead of its own server block:
# zeus exposes exactly one public 443 listener, nav-api owns it as the
# default_server, and requests that target the bare IP address are sent without
# SNI. nginx therefore always picks that default server, so the report has to
# share the vhost rather than get one of its own.
#
# nav-api keeps /api/v1/* and /portal*: exact and regex locations are more
# specific than this prefix match and keep winning, so both projects coexist.
# nav-api's server-level hardening (server_tokens, HSTS, timeouts, 4 KiB body
# cap, per-location rate limits) stays untouched.

location / {
    proxy_pass http://127.0.0.1:5003;
    proxy_http_version 1.1;

    # The Go service accepts JSON bodies up to 8 KiB (access applications);
    # the surrounding vhost caps everything at 4 KiB for nav-api, so lift the
    # limit for report paths only.
    client_max_body_size 64k;

    # The :80 vhost compresses JSON/CSS/JS; the shared vhost does not (its
    # gzip_types falls back to text/html only), so the report brings its own
    # settings. Without this the report over HTTPS ships /api/data and the
    # stylesheet uncompressed and is markedly slower than :80.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Excel export and cold data loads can exceed the 60s default.
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    # The Go service emits HSTS itself when X-Forwarded-Proto is https; drop it
    # so responses do not carry the header twice (nginx adds it at server level).
    proxy_hide_header Strict-Transport-Security;
}
