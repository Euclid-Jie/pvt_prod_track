log_format pvt_timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Official report entry. Nginx forwards HTTP to the local Ubuntu service.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/pvt-prod-track.access.log pvt_timed;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# Legacy public port. This server only returns a static migration page and
# never proxies requests to FRPS or the report application.
#
# It is TLS-enabled with the shared 120.48.74.113 certificate: once a browser has
# the site's HSTS record it upgrades every port for this host, so a plaintext-only
# legacy port fails its handshake instead of showing the notice page. Plaintext
# requests are upgraded through nginx status 497 ("HTTP request sent to HTTPS
# port"), mirroring the private-manager-archive vhost on 15110.
server {
    listen 15003 ssl;
    listen [::]:15003 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/120.48.74.113/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/120.48.74.113/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PVTLEGACY:1m;
    ssl_session_tickets off;

    error_page 497 =308 https://120.48.74.113:15003$request_uri;

    root /var/www/pvt-prod-track-legacy;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files /index.html =404;
    }
}
