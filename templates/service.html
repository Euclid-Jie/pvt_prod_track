<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#31169;&#21215;&#20135;&#21697;&#21608;&#25253;</title>
  <link rel="icon" href="/icon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="web-mode">
  <header class="web-topbar">
    <div class="web-brand">
      <span class="web-mark"></span>
      <div>
        <div class="web-eyebrow">PRIVATE FUND PERFORMANCE</div>
        <h1>&#31169;&#21215;&#20135;&#21697;&#21608;&#25253;</h1>
      </div>
    </div>
    <div class="web-actions">
      <span id="updateTime" class="web-sync">CONNECTING</span>
      <button id="refreshBtn" class="web-btn" type="button">&#21047;&#26032;</button>
      <button id="exportBtn" class="web-btn web-desktop-only" type="button">Excel</button>
    </div>
  </header>

  <main class="web-shell">
    <section class="web-stats" aria-label="summary">
      <article class="web-stat">
        <div class="web-stat-label">&#20135;&#21697;&#24635;&#25968;</div>
        <div class="web-stat-value" id="totalFunds">-</div>
        <div class="web-stat-hint">&#24403;&#21069;&#31579;&#36873;&#21518;</div>
      </article>
      <article class="web-stat">
        <div class="web-stat-label">&#36817;&#19968;&#21608;&#24179;&#22343;</div>
        <div class="web-stat-value" id="avgRecentWeek">-</div>
        <div class="web-stat-hint" id="weekRange">-</div>
      </article>
      <article class="web-stat">
        <div class="web-stat-label">YTD &#24179;&#22343;</div>
        <div class="web-stat-value" id="avgYtd">-</div>
        <div class="web-stat-hint" id="ytdRange">-</div>
      </article>
      <article class="web-stat web-wide-only">
        <div class="web-stat-label">&#36817;&#19968;&#24180;&#24179;&#22343;</div>
        <div class="web-stat-value" id="avgRecentYear">-</div>
        <div class="web-stat-hint">&#23436;&#25972;&#25351;&#26631;&#35270;&#22270;</div>
      </article>
    </section>

    <section class="web-panel web-filter-panel">
      <div class="web-filter-grid">
        <label class="web-field web-search-field">
          <span>&#20851;&#38190;&#35789;</span>
          <input id="searchInput" type="search" placeholder="&#31649;&#29702;&#20154;">
        </label>
        <label class="web-field">
          <span>&#31574;&#30053;&#31867;&#22411;</span>
          <select id="strategySelect">
            <option value="all">&#20840;&#37096;</option>
          </select>
        </label>
        <label class="web-field">
          <span>&#31649;&#29702;&#20154;&#35268;&#27169;</span>
          <select id="scaleSelect">
            <option value="all">&#20840;&#37096;</option>
            <option value="large">50&#20159;&#21450;&#20197;&#19978;</option>
            <option value="small">50&#20159;&#20197;&#19979;</option>
          </select>
        </label>
        <label class="web-field">
          <span>&#25490;&#24207;</span>
          <select id="sortSelect">
            <option value="recent_week">&#36817;&#19968;&#21608;</option>
            <option value="ytd">YTD</option>
            <option value="recent_year">&#36817;&#19968;&#24180;</option>
            <option value="manager">&#31649;&#29702;&#20154;</option>
          </select>
        </label>
      </div>
    </section>

    <section class="web-panel web-table-panel">
      <div class="web-panel-head">
        <div>
          <h2>&#20135;&#21697;&#26126;&#32454;</h2>
          <span class="web-mobile-note">&#25163;&#26426;&#35270;&#22270;&#20165;&#26174;&#31034;&#26412;&#21608;&#21644; YTD</span>
        </div>
        <span id="rowMeta" class="web-sync">-</span>
      </div>
      <div class="web-table-wrap">
        <table class="web-table">
          <thead>
            <tr>
              <th class="col-rank">&#25490;&#21517;</th>
              <th class="col-manager">&#31649;&#29702;&#20154;</th>
              <th class="col-scale">&#35268;&#27169;</th>
              <th class="col-strategy">&#31574;&#30053;&#31867;&#22411;</th>
              <th class="col-week">&#36817;&#19968;&#21608;(%)</th>
              <th class="col-ytd">YTD(%)</th>
              <th class="web-desktop-col">&#36817;&#19968;&#24180;(%)</th>
              <th class="web-desktop-col">&#36817;&#19968;&#24180;&#22799;&#26222;</th>
              <th class="web-desktop-col">&#36817;&#19968;&#24180;&#26368;&#22823;&#22238;&#25764;(%)</th>
              <th class="web-desktop-col">2025(%)</th>
              <th class="web-desktop-col">2024(%)</th>
              <th class="web-desktop-col">2023(%)</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="loading" class="web-loading">&#21152;&#36733;&#25968;&#25454;&#20013;...</div>

  <script>
    const text = {
      noData: "\u6682\u65e0\u6570\u636e",
      loadFailed: "\u52a0\u8f7d\u6570\u636e\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u670d\u52a1\u548c\u6570\u636e\u5e93\u914d\u7f6e",
      rows: "\u884c",
      updated: "\u5df2\u66f4\u65b0"
    };
    let allFundsData = [];
    let filteredData = [];

    const el = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? "-")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
    const fmt = v => {
      if (v === undefined || v === null || v === "" || v === "-" || v === "nan") return "-";
      const n = parseFloat(v);
      return Number.isNaN(n) ? v : n.toFixed(2);
    };
    const cls = (v, inv = false) => {
      const n = parseFloat(v);
      if (Number.isNaN(n)) return "";
      if (n > 0) return inv ? "web-negative" : "web-positive";
      if (n < 0) return inv ? "web-positive" : "web-negative";
      return "";
    };
    const numVal = (f, k) => {
      const v = parseFloat(f[k]);
      return Number.isNaN(v) ? null : v;
    };

    async function loadIntervals() {
      try {
        const d = await (await fetch("/api/intervals")).json();
        el("weekRange").textContent = `${d.week_begin || "-"} ~ ${d.week_end || "-"}`;
        el("ytdRange").textContent = `${d.ytd_begin || "-"} ~ ${d.ytd_end || "-"}`;
      } catch (e) {
        el("weekRange").textContent = "-";
        el("ytdRange").textContent = "-";
      }
    }

    async function loadStrategies() {
      const select = el("strategySelect");
      select.innerHTML = '<option value="all">\u5168\u90e8</option>';
      const strategies = [...new Set(allFundsData.map(f => f.strategy).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-CN"));
      for (const strategy of strategies) {
        const option = document.createElement("option");
        option.value = strategy;
        option.textContent = strategy;
        select.appendChild(option);
      }
    }

    async function loadData() {
      showLoading(true);
      try {
        const data = await (await fetch("/api/data")).json();
        allFundsData = data.funds || [];
        await loadStrategies();
        applyFilters();
        el("updateTime").textContent = `${text.updated} ${new Date().toLocaleTimeString("zh-CN")}`;
      } catch (e) {
        alert(text.loadFailed);
      } finally {
        showLoading(false);
      }
    }

    function applyFilters() {
      const search = el("searchInput").value.trim().toLowerCase();
      const strategy = el("strategySelect").value;
      const scale = el("scaleSelect").value;
      filteredData = allFundsData.filter(fund => {
        if (strategy !== "all" && fund.strategy !== strategy) return false;
        if (scale === "large" && fund.scale_level === "\u5c0f\u5382") return false;
        if (scale === "small" && fund.scale_level === "\u5927\u5382") return false;
        if (search) {
          const manager = (fund.manager || "").toLowerCase();
          if (!manager.includes(search)) return false;
        }
        return true;
      });
      sortAndRender();
      updateStats();
    }

    function sortAndRender() {
      const by = el("sortSelect").value;
      const sorted = [...filteredData].sort((a, b) => {
        if (by === "manager") return (a.manager || "").localeCompare(b.manager || "", "zh-CN");
        const av = numVal(a, by), bv = numVal(b, by);
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        return bv - av;
      });
      renderTable(sorted);
    }

    function renderTable(data) {
      const tbody = el("tableBody");
      tbody.innerHTML = "";
      if (!data.length) {
        tbody.innerHTML = `<tr><td class="web-empty" colspan="12">${text.noData}</td></tr>`;
        el("rowMeta").textContent = `0 ${text.rows}`;
        return;
      }
      const total = data.length;
      data.forEach((fund, index) => {
        const tr = document.createElement("tr");
        if (fund.manager === "\u57fa\u51c6") tr.classList.add("web-benchmark-row");
        tr.innerHTML = `
          <td data-label="\u6392\u540d" class="col-rank">${index + 1}/${total}</td>
          <td data-label="\u7ba1\u7406\u4eba" class="col-manager"><span class="web-main-cell">${escapeHtml(fund.manager || "-")}</span></td>
          <td data-label="\u89c4\u6a21" class="col-scale">${escapeHtml(fund.scale || "-")}</td>
          <td data-label="\u7b56\u7565" class="col-strategy">${escapeHtml(fund.strategy || "-")}</td>
          <td data-label="\u672c\u5468" class="${cls(fund.recent_week)} col-week">${fmt(fund.recent_week)}</td>
          <td data-label="YTD" class="${cls(fund.ytd)} col-ytd">${fmt(fund.ytd)}</td>
          <td data-label="\u8fd1\u4e00\u5e74" class="${cls(fund.recent_year)} web-desktop-col">${fmt(fund.recent_year)}</td>
          <td data-label="\u590f\u666e" class="${cls(fund.recent_year_sharpe)} web-desktop-col">${fmt(fund.recent_year_sharpe)}</td>
          <td data-label="\u56de\u64a4" class="${cls(fund.recent_year_mdd, true)} web-desktop-col">${fmt(fund.recent_year_mdd)}</td>
          <td data-label="2025" class="${cls(fund.y2025)} web-desktop-col">${fmt(fund.y2025)}</td>
          <td data-label="2024" class="${cls(fund.y2024)} web-desktop-col">${fmt(fund.y2024)}</td>
          <td data-label="2023" class="${cls(fund.y2023)} web-desktop-col">${fmt(fund.y2023)}</td>
        `;
        tbody.appendChild(tr);
      });
      el("rowMeta").textContent = `${data.length} ${text.rows}`;
    }

    function updateStats() {
      const d = filteredData.filter(f => f.manager !== "\u57fa\u51c6");
      el("totalFunds").textContent = d.length;
      const avg = key => {
        const vals = d.map(f => parseFloat(f[key])).filter(v => !Number.isNaN(v));
        if (!vals.length) return "-";
        return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) + "%";
      };
      el("avgRecentWeek").textContent = avg("recent_week");
      el("avgYtd").textContent = avg("ytd");
      el("avgRecentYear").textContent = avg("recent_year");
    }

    function showLoading(show) {
      el("loading").style.display = show ? "flex" : "none";
    }

    el("searchInput").addEventListener("input", applyFilters);
    el("strategySelect").addEventListener("change", applyFilters);
    el("scaleSelect").addEventListener("change", applyFilters);
    el("sortSelect").addEventListener("change", sortAndRender);
    el("refreshBtn").addEventListener("click", async () => {
      await fetch("/api/refresh", {method: "POST"});
      await loadData();
    });
    el("exportBtn").addEventListener("click", () => {
      window.open("/api/export/excel", "_blank");
    });

    document.addEventListener("DOMContentLoaded", async () => {
      await loadIntervals();
      await loadData();
    });
  </script>
</body>
</html>
