<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建议留言</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="web-mode web-feedback-page">
  <header class="web-topbar">
    <div class="web-brand">
      <span class="web-mark"></span>
      <div>
        <div class="web-eyebrow">SUGGESTIONS</div>
        <h1>建议留言</h1>
      </div>
    </div>
    <div class="web-actions">
      <a class="web-btn" href="/">返回周报</a>
    </div>
  </header>

  <main class="web-feedback-shell">
    <section class="web-feedback-intro">
      <p class="web-feedback-kicker">意见与回复</p>
      <h2>让周报更好用</h2>
      <p>欢迎提出功能建议或反馈使用问题。留言和管理员回复对所有已授权用户可见。</p>
    </section>

    <div class="web-feedback-layout">
      <form id="feedbackForm" class="web-feedback-compose">
        <label for="feedbackContent">写下建议</label>
        <textarea id="feedbackContent" maxlength="500" rows="7" required placeholder="例如：希望增加某项筛选，或说明遇到的问题。"></textarea>
        <div class="web-feedback-compose-foot">
          <span id="feedbackCount">0/500</span>
          <button id="feedbackSubmit" class="web-btn web-feedback-submit" type="submit">发布留言</button>
        </div>
        <p>将使用访问申请中的姓名展示，请勿填写敏感信息。</p>
        <div id="feedbackNotice" class="web-feedback-notice" role="status" aria-live="polite" hidden></div>
      </form>

      <section class="web-feedback-stream" aria-labelledby="feedbackListTitle">
        <div class="web-feedback-stream-head">
          <h2 id="feedbackListTitle">全部留言</h2>
          <span id="feedbackMeta" class="web-sync">-</span>
        </div>
        <div id="feedbackList" class="web-feedback-list"></div>
        <button id="feedbackLoadMore" class="web-btn web-feedback-load" type="button" hidden>查看更多留言</button>
      </section>
    </div>
  </main>

  <script>
    let feedbackEntries = [];
    let feedbackPage = 0;
    let feedbackTotal = 0;

    const el = id => document.getElementById(id);

    async function fetchJSON(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (response.ok) return data;
      throw new Error(data.message || `请求失败 (${response.status})`);
    }

    function feedbackNode(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = value;
      return node;
    }

    function formatFeedbackTime(value) {
      return value ? new Date(value).toLocaleString("zh-CN", {hour12: false}) : "-";
    }

    function setFeedbackNotice(message, kind = "info") {
      const notice = el("feedbackNotice");
      notice.textContent = message;
      notice.className = `web-feedback-notice is-${kind}`;
      notice.hidden = !message;
    }

    function renderFeedback() {
      const list = el("feedbackList");
      list.replaceChildren();
      el("feedbackMeta").textContent = `共 ${feedbackTotal} 条`;
      if (!feedbackEntries.length) {
        const empty = feedbackNode("div", "web-feedback-empty");
        empty.append(feedbackNode("strong", "", "还没有留言"), feedbackNode("p", "", "欢迎留下第一条使用建议。"));
        list.append(empty);
      }
      for (const item of feedbackEntries) {
        const card = feedbackNode("article", "web-feedback-card");
        const head = feedbackNode("div", "web-feedback-head");
        head.append(feedbackNode("strong", "", item.author || "已授权用户"), feedbackNode("time", "", formatFeedbackTime(item.created_at)));
        card.append(head, feedbackNode("p", "web-feedback-content", item.content));
        if (item.reply) {
          const reply = feedbackNode("div", "web-feedback-reply");
          const replyHead = feedbackNode("div", "web-feedback-reply-head");
          replyHead.append(feedbackNode("strong", "", "管理员回复"), feedbackNode("time", "", formatFeedbackTime(item.replied_at)));
          reply.append(replyHead, feedbackNode("p", "", item.reply));
          card.append(reply);
        }
        list.append(card);
      }
      el("feedbackLoadMore").hidden = feedbackEntries.length >= feedbackTotal;
    }

    async function loadFeedback(reset = false) {
      const button = el("feedbackLoadMore");
      button.disabled = true;
      const page = reset ? 1 : feedbackPage + 1;
      try {
        const data = await fetchJSON(`/api/feedback?page=${page}&page_size=20`);
        const entries = Array.isArray(data.feedback) ? data.feedback : [];
        feedbackEntries = reset ? entries : feedbackEntries.concat(entries);
        feedbackPage = page;
        feedbackTotal = data.total || 0;
        renderFeedback();
      } catch (error) {
        setFeedbackNotice(error.message, "error");
      } finally {
        button.disabled = false;
      }
    }

    el("feedbackContent").addEventListener("input", () => {
      el("feedbackCount").textContent = `${[...el("feedbackContent").value].length}/500`;
    });
    el("feedbackLoadMore").addEventListener("click", () => loadFeedback(false));
    el("feedbackForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = el("feedbackSubmit");
      button.disabled = true;
      setFeedbackNotice("");
      try {
        await fetchJSON("/api/feedback", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({content: el("feedbackContent").value})
        });
        el("feedbackContent").value = "";
        el("feedbackCount").textContent = "0/500";
        await loadFeedback(true);
        setFeedbackNotice("留言已发布。", "success");
      } catch (error) {
        setFeedbackNotice(error.message, "error");
      } finally {
        button.disabled = false;
      }
    });

    document.addEventListener("DOMContentLoaded", () => loadFeedback(true));
  </script>
</body>
</html>
